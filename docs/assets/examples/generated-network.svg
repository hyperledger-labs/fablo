<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Generated Fablo network files</title>
  <desc id="desc">A dark terminal window listing the main files in the fablo-target directory after running fablo generate.</desc>
  <rect width="1040" height="500" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="1038" height="498" rx="15" fill="none" stroke="#263040" stroke-width="2"/>
  <path d="M0 58H1040" stroke="#263040"/>
  <circle cx="28" cy="29" r="7" fill="#ff5f56"/><circle cx="52" cy="29" r="7" fill="#ffbd2e"/><circle cx="76" cy="29" r="7" fill="#27c93f"/>
  <text x="100" y="35" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">bash / fablo-generate</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="28" y="94" fill="#3fb950">$</text><text x="50" y="94" fill="#e6edf3">fablo generate</text>
    <text x="28" y="128" fill="#8b949e">Used network config: fablo-config.json</text>
    <text x="28" y="160" fill="#8b949e">Fabric version is: 3.1.0</text>
    <text x="28" y="192" fill="#7ee787">Network topology exported to fablo-target/network-topology.mmd</text>
    <text x="28" y="226" fill="#e6edf3">fablo-target/</text>
    <text x="52" y="258" fill="#8b949e">├── fabric-config/</text>
    <text x="52" y="290" fill="#c9d7e5">│   ├── configtx.yaml</text>
    <text x="52" y="322" fill="#c9d7e5">│   ├── connection-profiles/</text>
    <text x="52" y="354" fill="#c9d7e5">│   └── crypto-config-org1.yaml</text>
    <text x="52" y="386" fill="#8b949e">├── fabric-docker/</text>
    <text x="52" y="418" fill="#c9d7e5">│   ├── docker-compose.yaml</text>
    <text x="52" y="450" fill="#c9d7e5">│   └── chaincode-scripts.sh</text>
    <text x="52" y="482" fill="#8b949e">└── network-topology.mmd</text>
  </g>
</svg>
