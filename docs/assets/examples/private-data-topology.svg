<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Two-organization private data network topology</title>
  <desc id="desc">A dark generated-topology style diagram showing Org1 and Org2 peers connected to one channel and two chaincodes with separate private data collections.</desc>
  <rect width="1040" height="520" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="1038" height="518" rx="15" fill="none" stroke="#263040" stroke-width="2"/>
  <text x="30" y="40" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">network-topology.mmd / preview</text>
  <g fill="none" stroke="#38465a" stroke-width="2">
    <path d="M224 172 H348 V240 H412"/>
    <path d="M224 348 H348 V266 H412"/>
    <path d="M628 253 H790"/>
    <path d="M520 214 V154"/>
    <path d="M520 292 V354"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="32" y="100" width="192" height="144" rx="12" fill="#111722" stroke="#263040"/>
    <text x="52" y="132" fill="#e6edf3" font-size="18" font-weight="700">Org1</text><text x="52" y="156" fill="#8b949e" font-size="14">org1.example.com</text>
    <rect x="52" y="178" width="152" height="42" rx="7" fill="#0d1117" stroke="#3fb950"/><text x="68" y="204" fill="#c9d7e5" font-size="14">peer0 / peer1</text>
    <rect x="32" y="276" width="192" height="144" rx="12" fill="#111722" stroke="#263040"/>
    <text x="52" y="308" fill="#e6edf3" font-size="18" font-weight="700">Org2</text><text x="52" y="332" fill="#8b949e" font-size="14">org2.example.com</text>
    <rect x="52" y="354" width="152" height="42" rx="7" fill="#0d1117" stroke="#3fb950"/><text x="68" y="380" fill="#c9d7e5" font-size="14">peer0</text>
    <rect x="412" y="214" width="216" height="78" rx="12" fill="#112018" stroke="#3fb950" stroke-width="2"/>
    <text x="452" y="247" fill="#7ee787" font-size="14">CHANNEL</text><text x="452" y="274" fill="#e6edf3" font-size="19" font-weight="700">my-channel1</text>
    <rect x="404" y="88" width="232" height="66" rx="10" fill="#111722" stroke="#263040"/><text x="434" y="118" fill="#e6edf3" font-size="16" font-weight="700">or-policy-chaincode</text><text x="434" y="140" fill="#8b949e" font-size="13">Org1 private collection</text>
    <rect x="404" y="354" width="232" height="66" rx="10" fill="#111722" stroke="#263040"/><text x="432" y="384" fill="#e6edf3" font-size="16" font-weight="700">and-policy-chaincode</text><text x="432" y="406" fill="#8b949e" font-size="13">Org1 + Org2 collection</text>
    <rect x="790" y="194" width="218" height="118" rx="12" fill="#111722" stroke="#263040"/>
    <text x="812" y="226" fill="#e6edf3" font-size="18" font-weight="700">Orderer</text><text x="812" y="250" fill="#8b949e" font-size="14">group1</text><text x="812" y="280" fill="#c9d7e5" font-size="15">solo / Fabric 2.5</text>
  </g>
