name: Implement issue

# Maintainer comments `/implement` as the first line of an issue comment.
# The agent implements in the working tree, checks run, then a pull request is
# opened. Full Fabric network e2e stays on Tests (test-on-push.yml). The pull
# request is the review surface — a human merges. The agent never merges.
#
# The same command on that pull request starts another round. The agent gets
# the comment's instructions, the unresolved review threads, and the reviews,
# edits the pull request branch, and the result is pushed to it as a new
# commit. Leave review comments on the diff first, then comment `/implement`
# (with or without more instructions) to have them addressed. Only pull
# requests on an ai/issue-<n> branch of this repository can be revised.
#
# What runs here: .jaiph/implement_issue.jh (Claude Code edits the tree; Jaiph
# does not push), then npm run build, test:unit and lint, then a snapshot
# rebuild via npm run test:e2e-update for anything that is not a docs-only
# change. A pull request is opened either way, as a draft if a check failed.
#
# The agent may change .github/ and .jaiph/ — an issue may be about the CI or
# the Jaiph programs themselves — so a new e2e-network/docker test script can
# come with its own job in test-on-push.yml. Such a change forces the pull
# request to open as a draft and is called out in its body, because those files
# run with repository credentials. What the agent may never do is rewrite
# history or edit credential files; verification.jh enforces that.
#
# Who may trigger it: anyone with write access, plus any login in the
# AI_ALLOWED_ACTORS repository variable (comma-separated). That variable lets a
# maintainer hand the bot to a contributor without giving them write access;
# only a repository admin can set it.
#
# Required repository secret: CLAUDE_CODE_OAUTH_TOKEN (same as docs-parity).
# The default GITHUB_TOKEN is enough to comment and open a PR. GitHub prevents
# that token from triggering a second workflow, so Tests must be dispatched
# manually against the generated branch.
#
# The issue_comment trigger always runs the copy of this file on the default
# branch. To try a change to it before merging, use Run workflow from the
# Actions tab with the branch selected there. Review events are deliberately
# not triggers: they would run the workflow file from the pull request branch,
# which the agent wrote.
#
# A revise checks out the pull request branch, which the agent wrote and nobody
# has merged yet. So the Jaiph programs and scripts that drive the run are
# copied from the trusted checkout first and always run from that copy, and
# the Claude token is given only to the steps that call Claude.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to implement, or implementation pull request to revise"
        required: true
        type: string
      additional_instructions:
        description: "Optional additional instructions for the agent"
        required: false
        type: string

concurrency:
  group: implement-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    # The comment must start with the command, so an `/implement` quoted inside
    # a longer comment does not trigger a run. It may be on an issue or on a
    # pull request; the gate script tells the two apart. Write access to the
    # repository is verified by the gate script, for this event and for
    # workflow_dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        startsWith(github.event.comment.body, '/implement')
      )
    runs-on: ubuntu-latest
    # Opus, a Fablo Docker build, and the e2e snapshot rebuild all sit inside
    # this budget, so it is well above what the cheap checks alone would need.
    timeout-minutes: 60
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Claude runs later in this job. Do not leave GitHub push credentials
          # in the repository's local git configuration for it to discover.
          persist-credentials: false

      # Taken before a revise switches to the pull request branch; see the note
      # at the top of this file.
      - name: Keep a trusted copy of the automation
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted"
          echo "TRUSTED=$TRUSTED" >> "$GITHUB_ENV"
          mkdir -p "$TRUSTED/.github"
          cp -R .github/scripts "$TRUSTED/.github/scripts"
          rsync -a --exclude tmp --exclude runs .jaiph/ "$TRUSTED/.jaiph/"

      # Caller, issue or pull request, its state, and duplicate pull request are
      # all checked by one script; it also writes the agent's payload and
      # acknowledges on the issue or pull request. A refusal fails the job, so
      # every later step is skipped without repeating the condition.
      - name: Gate and prepare the implement run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ADDITIONAL_INPUT: ${{ inputs.additional_instructions }}
          TRIGGER_ACTOR: ${{ github.actor }}
          AI_ALLOWED_ACTORS: ${{ vars.AI_ALLOWED_ACTORS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$TRUSTED"/.github/scripts/implement-issue-gate.sh'

      # A revise continues the pull request branch. `clean: false` keeps the
      # payload the gate left in .jaiph/tmp, which git ignores.
      - name: Check out the pull request branch
        if: steps.gate.outputs.mode == 'revise'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      # The commit the agent starts from: the base commit for an implement, the
      # pull request head for a revise. The history check compares against it.
      - name: Record the starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Jaiph
        uses: jaiphlang/jaiph/actions/setup-jaiph@v0.15.0
        with:
          version: 0.15.0

      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          command -v claude
          claude -p "/usage"

      - name: Implement the issue
        id: implement
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          jaiph run --workspace "$GITHUB_WORKSPACE" "$TRUSTED/.jaiph/implement_issue.jh" \
            .jaiph/tmp/issue.json "${{ steps.gate.outputs.mode }}"

      - name: Show implementation diff
        if: always() && steps.implement.outcome != 'skipped'
        run: |
          git diff --stat
          git diff
          git status --short

      - name: Save git patch
        id: patch
        if: always() && steps.implement.outcome != 'skipped'
        run: '"$TRUSTED"/.jaiph/git/save-worktree-patch.sh'

      - name: Upload git patch
        if: always() && steps.implement.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: implement-issue-patch-${{ github.run_id }}
          path: ${{ steps.patch.outputs.patch_file }}
          if-no-files-found: error
          retention-days: 14

      # The agent is allowed to change .github/ and .jaiph/ — an issue may be
      # about the automation itself. Such a change is not refused, but it must
      # not reach review unnoticed: it forces the pull request to open as a
      # draft and prints a warning in the body.
      - name: Flag changes to the automation
        id: automation
        if: always() && (steps.implement.outcome == 'success' || steps.implement.outcome == 'failure')
        run: |
          set -euo pipefail
          paths="$(
            { git diff --name-only HEAD -- .github .jaiph
              git ls-files --others --exclude-standard -- .github .jaiph
            } | sort -u
          )"
          if [ -z "$paths" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "warning=" >> "$GITHUB_OUTPUT"
            echo "The automation was not changed."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "The automation was changed:"
          printf '%s\n' "$paths" | sed 's/^/  /'
          {
            echo "warning<<AUTOMATION_WARNING"
            echo "> [!WARNING]"
            echo "> This pull request changes the automation that produced it:"
            printf '%s\n' "$paths" | sed 's/^/> - `/; s/$/`/'
            echo ">"
            echo "> Review these files closely. They run with repository credentials."
            echo "AUTOMATION_WARNING"
          } >> "$GITHUB_OUTPUT"

      # The agent may have failed part way through, so the policy is re-run
      # here before anything is pushed.
      - name: Enforce no destructive changes
        id: safety
        if: always() && (steps.implement.outcome == 'success' || steps.implement.outcome == 'failure')
        run: |
          jaiph run --workspace "$GITHUB_WORKSPACE" "$TRUSTED/.jaiph/verification.jh" \
            no_destructive_changes "${{ steps.start.outputs.sha }}"

      - name: Open a pull request
        id: cpr
        if: always() && steps.safety.outcome == 'success' && steps.gate.outputs.mode == 'implement'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/issue-${{ steps.gate.outputs.issue_number }}
          base: ${{ env.BASE_BRANCH }}
          title: "Implement #${{ steps.gate.outputs.issue_number }}: ${{ steps.gate.outputs.title }}"
          draft: ${{ steps.implement.outcome != 'success' || steps.automation.outputs.changed == 'true' }}
          signoff: true
          commit-message: |
            Implement #${{ steps.gate.outputs.issue_number }}

            Triggered by ${{ github.actor }} via the implement-issue workflow.
          body: |
            Fixes #${{ steps.gate.outputs.issue_number }}

            Implemented from a maintainer `/implement` command.

            ${{ steps.automation.outputs.warning }}

            **Review the diff before merging.** The agent can be wrong.
            `npm run build`, `npm run test:unit` and `npm run lint` ran in this
            workflow, and unless the change is docs-only the e2e snapshots were
            regenerated with `npm run test:e2e-update`. Full network e2e runs on
            this pull request via Tests.

            If this adds a script under `e2e-network/docker/`, check that it
            also adds the matching job to `.github/workflows/test-on-push.yml`.

            If Checks did not start, dispatch the `Tests` workflow manually
            against this PR branch. GitHub does not let a workflow started
            with the default `GITHUB_TOKEN` trigger another workflow.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          delete-branch: true

      # A revise adds a commit to the pull request branch instead. The push is
      # not forced: if someone pushed to the branch during the run, it is
      # rejected rather than overwriting their work.
      - name: Push to the pull request
        id: push
        if: always() && steps.safety.outcome == 'success' && steps.gate.outputs.mode == 'revise'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No file changes; nothing to push."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -s -m "Address review on #${ISSUE_NUMBER}" \
            -m "Triggered by ${{ github.actor }} via the implement-issue workflow."
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A failed check or a change to the automation turns the pull request
      # back into a draft, the same rule an implement run opens it with.
      - name: Mark the pull request as a draft
        if: >
          always() && steps.push.outputs.pushed == 'true' &&
          (steps.implement.outcome != 'success' || steps.automation.outputs.changed == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready "$ISSUE_NUMBER" --undo

      - name: Comment on the issue
        if: always() && steps.gate.outcome == 'success' && steps.gate.outputs.mode == 'implement'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${PR_OP:-}" = "created" ] || [ "${PR_OP:-}" = "updated" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Opened ${PR_URL} for #${ISSUE_NUMBER}. If Checks did not start, run the Tests workflow manually against the PR branch."
          elif [ "${PR_OP:-}" = "skipped" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "No file changes; no pull request opened. See ${RUN_URL}."
          else
            gh issue comment "$ISSUE_NUMBER" --body "Implement run finished without a pull request. See ${RUN_URL}."
          fi

      - name: Comment on the pull request
        if: always() && steps.gate.outcome == 'success' && steps.gate.outputs.mode == 'revise'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          CHECKS_PASSED: ${{ steps.implement.outcome == 'success' }}
          AUTOMATION_WARNING: ${{ steps.automation.outputs.warning }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${PUSHED:-}" = "true" ]; then
            body="Pushed $(git rev-parse --short HEAD) to address the review. See ${RUN_URL} for what changed."
            if [ "$CHECKS_PASSED" != "true" ]; then
              body="${body}"$'\n\n'"A check failed, so this pull request is a draft again."
            fi
            if [ -n "${AUTOMATION_WARNING:-}" ]; then
              body="${body}"$'\n\n'"${AUTOMATION_WARNING}"
            fi
            body="${body}"$'\n\n'"If Checks did not start, run the Tests workflow manually against this branch. Resolve the review threads that are done, and comment \`/implement\` again for another round."
          elif [ "${PUSHED:-}" = "false" ]; then
            body="No file changes; nothing pushed. See ${RUN_URL}."
          else
            body="Revise run finished without pushing. See ${RUN_URL}."
          fi
          gh pr comment "$ISSUE_NUMBER" --body "$body"
