name: Docs parity

# Keeps the documentation honest against the implementation.
# Manual dispatch runs the agent in fix mode, shows the recommended diff,
# and opens a pull request with the edits.

on:
  # pull_request:
  #   paths:
  #     - "docs/**"
  #     - "README.md"
  #     - "SUPPORTED_FEATURES.md"
  #     - "ARCHITECTURE.md"
  #     - "fablo.sh"
  #     - "src/**"
  #     - ".jaiph/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Jaiph
        uses: jaiphlang/jaiph/actions/setup-jaiph@v0.13.0
        with:
          version: 0.13.0

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          command -v claude

      - name: Validate workflow definitions
        run: |
          jaiph compile .jaiph
          jaiph test .jaiph/docs_parity.test.jh

      - name: Fix documentation drift
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .jaiph/docs_parity.jh --unsafe fix

      - name: Show recommended documentation changes
        if: always()
        run: |
          git diff --stat
          git diff

      - name: Open a pull request with the corrections
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/parity-sync-${{ github.run_id }}
          title: "docs: sync documentation with the implementation"
          commit-message: "docs: sync documentation with the implementation"
          body: |
            Automated documentation parity pass (`.jaiph/docs_parity.jh fix`).

            Each page was checked against its source of truth in the
            implementation. Review the diff before merging: the agent edits
            prose, and prose can be wrong.

            `docs/fablo.sh` is a generated mirror and was synced from
            `./fablo.sh` by the workflow, not edited directly.
          delete-branch: true
