logging:
  level: info

msp:
  localMspID: Org1MSP
  configPath: /msp

orderer:
  address: orderer-router:7050
  channel: mychannel
  tls:
    enabled: true
    clientCert: /tls/server.crt
    clientKey: /tls/server.key
    rootCerts:
      - /orderer-tls-ca.pem 
      - /org-tls-ca.pem      

queries:
  address: committer-org1-query-service:7001
  tls:
    enabled: true
    clientCert: /tls/server.crt
    clientKey: /tls/server.key
    rootCerts:
      - /org-tls-ca.pem

notifications:
  address: committer-org1-sidecar:4001
  tls:
    enabled: true
    clientCert: /tls/server.crt
    clientKey: /tls/server.key
    rootCerts:
      - /org-tls-ca.pem
  connectionTimeout: 10s
  waitingTimeout: 20s