logging:
  level: info

msp:
  localMspID: <%= fabricX.applicationOrg.mspName %>
  configPath: /msp

orderer:
  address: orderer-router:7050
  channel: <%- fabricX.channelName %>
  tls:
    enabled: true
    clientCert: /tls/server.crt
    clientKey: /tls/server.key
    rootCerts:
      - /orderer-tls-ca.pem 
      - /org-tls-ca.pem      

queries:
  address: committer-<%= fabricX.applicationOrgSlug %>-query-service:7001
  tls:
    enabled: true
    clientCert: /tls/server.crt
    clientKey: /tls/server.key
    rootCerts:
      - /org-tls-ca.pem

notifications:
  address: committer-<%= fabricX.applicationOrgSlug %>-sidecar:4001
  tls:
    enabled: true
    clientCert: /tls/server.crt
    clientKey: /tls/server.key
    rootCerts:
      - /org-tls-ca.pem
  connectionTimeout: 10s
  waitingTimeout: 20s