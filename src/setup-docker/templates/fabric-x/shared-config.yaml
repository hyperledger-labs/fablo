
# Arma Shared Configuration for the dynamic devnet.
# Cert paths are absolute inside the Docker container (config/crypto/ mounted at /crypto).

Parties:

<%_ fabricX.orderer.parties.forEach((party) => { -%>
<%_ const dir = (node) => `/crypto/${node.cryptoDir}`; -%>
  - PartyID: <%= party.partyId %>
    CACerts:
      - /crypto/ordererOrganizations/<%= party.org.domain %>/msp/cacerts/ca.<%= party.org.domain %>-cert.pem
    TLSCACerts:
      - /crypto/ordererOrganizations/<%= party.org.domain %>/msp/tlscacerts/tlsca.<%= party.org.domain %>-cert.pem
    RouterConfig:
      TLSCert: <%= dir(party.router) %>/tls/server.crt
      Host: <%= party.router.host %>
      Port: <%= party.router.port %>
    BatchersConfig:
<%_ party.batchers.forEach((batcher) => { -%>
      - ShardID: <%= batcher.shardId %>
        SignCert: <%= dir(batcher) %>/msp/signcerts/<%= batcher.cryptoName %>.<%= party.org.domain %>-cert.pem
        TLSCert: <%= dir(batcher) %>/tls/server.crt
        Host: <%= batcher.host %>
        Port: <%= batcher.port %>
<%_ }); -%>
    ConsenterConfig:
      SignCert: <%= dir(party.consenter) %>/msp/signcerts/<%= party.consenter.cryptoName %>.<%= party.org.domain %>-cert.pem
      TLSCert: <%= dir(party.consenter) %>/tls/server.crt
      Host: <%= party.consenter.host %>
      Port: <%= party.consenter.port %>
    AssemblerConfig:
      TLSCert: <%= dir(party.assembler) %>/tls/server.crt
      Host: <%= party.assembler.host %>
      Port: <%= party.assembler.port %>
<%_ }); -%>


Consensus:
  SmartBFT:
    requestbatchmaxcount: 10000
    requestbatchmaxbytes: 10485760
    requestbatchmaxinterval: 100ms
    incomingmessagebuffersize: 200
    requestpoolsize: 500000
    requestforwardtimeout: 2s
    requestcomplaintimeout: 20s
    requestautoremovetimeout: 3m0s
    viewchangeresendinterval: 5s
    viewchangetimeout: 20s
    leaderheartbeattimeout: 1m0s
    leaderheartbeatcount: 10
    numofticksbehindbeforesyncing: 10
    collecttimeout: 1s
    requestmaxbytes: 1048576
    requestpoolsubmittimeout: 5s

Batching:
  BatchTimeouts:
    BatchCreationTimeout: 20ms # optimize for low latency
    FirstStrikeThreshold: 10s
    SecondStrikeThreshold: 10s
    AutoRemoveTimeout: 10s
  BatchSize:
    MaxMessageCount: 10000
    AbsoluteMaxBytes: 10485760
    PreferredMaxBytes: 2097152
  RequestMaxBytes: 1048576

MaxPartyID: <%= fabricX.orderer.parties.length %>
