name: fabric-x


networks:
  fabric-x:
    name: fabric-x
    driver: bridge

volumes:
<%_ fabricX.applicationOrgs.forEach((org) => { _%>
  committer-<%= org.slug %>-db-data:
<%_ }); _%>

services:

<%_ fabricX.orderer.parties.forEach((party) => { -%>
  # ─── Orderer Party <%= party.partyId %> ───────────────────────────────────────────────────────
<%_ party.nodes.forEach((node) => { -%>
  <%= node.host %>:
    container_name: <%= node.host %>
    image: <%= global.ordererImage %>
    pull_policy: missing
    restart: unless-stopped
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: <%= node.command %> --config=/config/node_config.yaml
    ports:
      - "<%= node.port %>:<%= node.port %>"
    volumes:
      - ./<%= node.configFile %>:/config/node_config.yaml:ro,Z
      - ./crypto/<%= node.cryptoDir %>/tls:/node-tls:ro,Z
      - ./crypto/<%= node.cryptoDir %>/msp:/node-msp:ro,Z
      - ./crypto/ordererOrganizations/<%= party.org.domain %>/msp/tlscacerts/tlsca.<%= party.org.domain %>-cert.pem:/org-tls-ca.pem:ro,Z
<%_ if (node.acceptsClients) { -%>
      - ./crypto/client-tls-ca.pem:/client-tls-ca.pem:ro,Z
<%_ } -%>
      - ./crypto/config-block.pb.bin:/bootstrap/genesis.block:ro,Z
      - ./<%= node.dataDir %>:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9443/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
<%_ if (node.dependsOn.length > 0) { -%>
    depends_on:
<%_ node.dependsOn.forEach((dependency) => { -%>
      <%= dependency %>:
        condition: service_healthy
<%_ }); -%>
<%_ } -%>
    networks:
      - fabric-x

<%_ }); -%>
<%_ }); -%>


<%_ fabricX.applicationOrgs.forEach((org) => { _%>
  # ─── <%= org.name %> Committer Stack ───────────────────────────────────────────────────

  committer-<%= org.slug %>-db:
    image: <%= global.postgresImage %>
    command: postgres -c max_connections=500
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: fabricx
      POSTGRES_USER: fabricx
      POSTGRES_PASSWORD: fabricx
      PGDATA: /var/lib/postgresql/data
    volumes:
      - committer-<%= org.slug %>-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabricx -d fabricx"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - fabric-x

  committer-<%= org.slug %>-init-db:
    image: <%= global.committerImage %>
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: init-db --config=/config/validator.yaml
    volumes:
      - ./config/committer-<%= org.slug %>-validator.yaml:/config/validator.yaml:ro,Z
    depends_on:
      committer-<%= org.slug %>-db:
        condition: service_healthy
    networks:
      - fabric-x

  committer-<%= org.slug %>-verifier:
    image: <%= global.committerImage %>
    pull_policy: missing
    restart: unless-stopped
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: start verifier --config=/config/verifier.yaml
    volumes:
      - ./config/verifier.yaml:/config/verifier.yaml:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/peers/committer-verifier.<%= org.domain %>/tls:/node-tls:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/msp/tlscacerts/tlsca.<%= org.domain %>-cert.pem:/org-tls-ca.pem:ro,Z
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2115/metrics"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - fabric-x

  committer-<%= org.slug %>-validator:
    image: <%= global.committerImage %>
    pull_policy: missing
    restart: unless-stopped
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: start vc --config=/config/validator.yaml
    volumes:
      - ./config/committer-<%= org.slug %>-validator.yaml:/config/validator.yaml:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/peers/committer-validator.<%= org.domain %>/tls:/node-tls:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/msp/tlscacerts/tlsca.<%= org.domain %>-cert.pem:/org-tls-ca.pem:ro,Z
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2116/metrics"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      committer-<%= org.slug %>-db:
        condition: service_healthy
      committer-<%= org.slug %>-init-db:
        condition: service_completed_successfully
    networks:
      - fabric-x

  committer-<%= org.slug %>-coordinator:
    image: <%= global.committerImage %>
    pull_policy: missing
    restart: unless-stopped
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: start coordinator --config=/config/coordinator.yaml
    volumes:
      - ./config/committer-<%= org.slug %>-coordinator.yaml:/config/coordinator.yaml:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/peers/committer-coordinator.<%= org.domain %>/tls:/node-tls:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/msp/tlscacerts/tlsca.<%= org.domain %>-cert.pem:/org-tls-ca.pem:ro,Z
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2119/metrics"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      committer-<%= org.slug %>-verifier:
        condition: service_healthy
      committer-<%= org.slug %>-validator:
        condition: service_healthy
    networks:
      - fabric-x

  committer-<%= org.slug %>-sidecar:
    image: <%= global.committerImage %>
    pull_policy: missing
    restart: unless-stopped
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: start sidecar --config=/config/sidecar.yaml
    ports:
      - "<%= org.sidecarPort %>:4001"
    volumes:
      - ./config/committer-<%= org.slug %>-sidecar.yaml:/config/sidecar.yaml:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/peers/committer-sidecar.<%= org.domain %>/tls:/node-tls:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/msp/tlscacerts/tlsca.<%= org.domain %>-cert.pem:/org-tls-ca.pem:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/users/User1@<%= org.domain %>/msp:/msp:ro,Z
      - ./crypto/ordererOrganizations:/orderer-cas:ro,Z
      - ./crypto/config-block.pb.bin:/bootstrap/genesis.block:ro,Z
      - ./data/committer-<%= org.slug %>/sidecar-ledger:/ledger:Z
    healthcheck:
      test: ["CMD", "curl", "-sk", "--cert", "/node-tls/server.crt", "--key", "/node-tls/server.key", "https://localhost:2114/metrics"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      committer-<%= org.slug %>-coordinator:
        condition: service_healthy

<%_ fabricX.orderer.parties.forEach((party) => { -%>
      <%= party.router.host %>:
        condition: service_healthy
<%_ }); -%>

    networks:
      - fabric-x

  committer-<%= org.slug %>-query-service:
    image: <%= global.committerImage %>
    pull_policy: missing
    restart: unless-stopped
    user: "${FABRIC_X_UID:-1000}:${FABRIC_X_GID:-1000}"
    command: start query --config=/config/query-service.yaml
    ports:
      - "<%= org.queryServicePort %>:7001"
    volumes:
      - ./config/committer-<%= org.slug %>-query-service.yaml:/config/query-service.yaml:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/peers/committer-query-service.<%= org.domain %>/tls:/node-tls:ro,Z
      - ./crypto/peerOrganizations/<%= org.domain %>/msp/tlscacerts/tlsca.<%= org.domain %>-cert.pem:/org-tls-ca.pem:ro,Z
    depends_on:
      committer-<%= org.slug %>-db:
        condition: service_healthy
      committer-<%= org.slug %>-init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2117/metrics"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - fabric-x
<%_ }); _%>
