---
OrdererOrgs:

<%_ fabricX.orderer.parties.forEach((party, index) => { -%>
  - Name: <%= party.org.name %>
    Domain: <%= party.org.domain %>
    EnableNodeOUs: false
    CA:
      Hostname: ca
    Specs:
<%_ [party.router, ...party.batchers, party.consenter, party.assembler].forEach((node) => { -%>
      - Hostname: <%= node.cryptoName %>
        Party: <%= party.slug %>
        SANS:
          - <%= node.host %>
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
<%_ }); -%>
    Users:
      Count: 1
<%_ if (index < fabricX.orderer.parties.length - 1) { -%>

<%_ } -%>
<%_ }); -%>


PeerOrgs:

  - Name: <%= fabricX.applicationOrg.name %>
    Domain: <%= fabricX.applicationOrg.domain %>
    EnableNodeOUs: false
    CA:
      hostname: ca
      SANS:
        - 0.0.0.0
        - localhost
        - 127.0.0.1
        - ::1
    Users:
      Count: 1
      Specs:
        - Name: channel_admin
          HSM: false
    Specs:
      - Hostname: committer-sidecar
        SANS:
          - committer-<%= fabricX.applicationOrgSlug %>-sidecar
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
      - Hostname: committer-coordinator
        SANS:
          - committer-<%= fabricX.applicationOrgSlug %>-coordinator
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
      - Hostname: committer-validator
        SANS:
          - committer-<%= fabricX.applicationOrgSlug %>-validator
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
      - Hostname: committer-verifier
        SANS:
          - committer-<%= fabricX.applicationOrgSlug %>-verifier
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
      - Hostname: committer-query-service
        SANS:
          - committer-<%= fabricX.applicationOrgSlug %>-query-service
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
      - Hostname: endorser
        SANS:
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1
      - Hostname: fxconfig
        SANS:
          - host.docker.internal
          - 0.0.0.0
          - localhost
          - 127.0.0.1
          - ::1

